{% extends "base.html" %}

{% block title %}500 - Internal Server Error | UniversalQR{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 580px; margin: 40px auto; padding: 50px 30px;">
    <div class="empty-state-icon" style="background: var(--danger-light); color: var(--danger-dark);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
    </div>
    <h2>Unexpected System Error</h2>
    <p>A server error occurred while processing your request. Please try again or return to the dashboard.</p>
    <div style="display:flex; justify-content:center; gap:12px;">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Refresh Page</a>
    </div>
</div>
{% endblock %}
