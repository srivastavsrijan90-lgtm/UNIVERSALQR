{% extends "base.html" %}

{% block title %}Sign In | UniversalQR System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand-seal">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to access your UniversalQR identity dashboard</p>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required autofocus value="{{ request.form.get('email', '') }}">
            </div>

            <div class="form-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;">
                    <label for="password" style="margin-bottom:0;">Password</label>
                </div>
                <div class="password-input-wrap">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)">Show</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:10px;">
                Sign In to Dashboard →
            </button>
        </form>

        <p class="auth-footer-link">
            Don't have an account yet? 
            <a href="{{ url_for('signup') }}" style="font-weight:700;">Create free account</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = 'Hide';
        } else {
            input.type = 'password';
            btn.textContent = 'Show';
        }
    }
</script>
{% endblock %}
